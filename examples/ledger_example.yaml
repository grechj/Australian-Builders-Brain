# Example job ledger (fictional). Copy it to ledger.yaml in your own folder.
# One entry per invoice, credit note, bill or supplier credit, with the
# payments made against it. Amounts are ex GST; GST is calculated per line.
# ABNs are made up and only pass the ABN checksum.
#
# type:     invoice | credit_note (your sales)   bill | supplier_credit (your purchases)
# account:  a role from accounts.yaml (contract_income, subcontractors, materials...)
# tax:      gst | gst_free | export | input_taxed | capital | bas_excluded
# tpar:     optional on a bill; defaults from accounts.yaml tpar_accounts

