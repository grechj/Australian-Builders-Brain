# Example project register (fictional). tools/projects.py keeps it (new, tag,
# inbox) and tools/dashboard.py reads it. List every job: current ones and
# completed ones (which give the averages a job is compared against). Paths
# are relative to this file. A project made with `projects.py new` just needs
# `folder:`; these examples spell out each file instead.
#
# Each job takes its details from its project file, or from the keys here
# (keys here win). budget: the estimate's cost by role, ex GST.
# documents: the folder the skills write that job's documents into; add
# documents_url (the same folder in Dropbox, Google Drive or SharePoint) to
# make the dashboard's links open there instead.

accounts: accounts_example.yaml     # one account mapping for the import files

projects:
  - project: project_example.yaml
    tags: [banksia, citizen, 42 Banksia St]
    ledger: ledger_example.yaml
    timesheets: timesheets_example.csv
    documents: ../out/jobs/SB-2027-014      # created when you generate documents for the job
    status: active
    start_date: 03/08/2026          # the example project file's dates are illustrative; this job started earlier
    contract_end_date: 30/04/2027
    target_margin_pct: 18
    budget: {subcontractors: 96000, materials: 118000, plant_hire: 9500, site_costs: 12000, own_labour: 120000}

  - job: SB-2025-031
    tags: [lambton, lee]
    name: Lambton Rd renovation
    project_type: renovation
    state: NSW
    status: complete
    contract_sum_ex_gst: 168000
    start_date: 10/02/2025
    contract_end_date: 01/08/2025
    pc_date: 22/08/2025
    target_margin_pct: 18
    ledger: ledger_job_sb_2025_031.yaml
    timesheets: timesheets_job_sb_2025_031.csv
    budget: {subcontractors: 61000, materials: 52000, plant_hire: 4000, own_labour: 24000}

  - job: SB-2026-007
    tags: [hill st]
    name: Hill St extension
    project_type: extension
    state: NSW
    status: complete
    contract_sum_ex_gst: 312000
    start_date: 03/02/2026
    contract_end_date: 31/07/2026
    pc_date: 14/08/2026
    target_margin_pct: 18
    ledger: ledger_job_sb_2026_007.yaml
    timesheets: timesheets_job_sb_2026_007.csv
    budget: {subcontractors: 112000, materials: 98000, plant_hire: 7000, own_labour: 32000}
