# NCC 2022 Amendments 1 and 2, transcribed from the ABCB's amendment documents:
#   Amendment 1, version 1.1, released 8 April 2025, effective 1 May 2025
#     https://ncc.abcb.gov.au/sites/default/files/resources/2025/NCC%202022%20Amdt%201%20v1.1.pdf
#   Amendment 2, version 1.0, released 28 July 2025, effective 29 July 2025
#     https://www.abcb.gov.au/sites/default/files/resources/2025/NCC%202022%20Amdt%202_0.pdf
#
# tools/apply_ncc_amendments.py turns each entry into a notice under the clause
# it changes (or a new page for a new Part). Text is the ABCB's, as amended
# (CC BY 4.0). Preface-only changes (licence notice, history of adoption, list
# of amendments, WA introductions) are listed on the amendments page only.
#
# Entry fields: amendment, volume, page (file in brain/ncc/2022/<volume>/),
# anchor (clause code; omit for a Part-level notice), state (only for state
# variations), instruction, text (markdown). new_page entries create a page.

amendments:
  "1":
    title: NCC 2022 Amendment 1
    effective: 1 May 2025
    version: "1.1 (8 April 2025)"
    url: https://ncc.abcb.gov.au/sites/default/files/resources/2025/NCC%202022%20Amdt%201%20v1.1.pdf
    purpose: Update the copyright and licence notice (CC BY-ND to CC BY 4.0); amend variations and additions for Western Australia; amend the variation for Tasmania regarding Part H8; correct errors.
  "2":
    title: NCC 2022 Amendment 2
    effective: 29 July 2025
    version: "1.0 (28 July 2025)"
    url: https://www.abcb.gov.au/sites/default/files/resources/2025/NCC%202022%20Amdt%202_0.pdf
    purpose: Align the NCC with the Access Code in the Disability (Access to Premises — Buildings) Standards 2010 (AS 1428.1 updated to the 2021 edition).

preface_only:
  - amendment: "1"
    note: "All volumes: copyright and licence notice replaced (now CC BY 4.0, excluding third-party material, trade marks, images and photographs); attribution wording replaced; Schedule 2 Table 1 Table Note (6) deleted and notes renumbered; Amendment 1 added to the history of adoption; 'List of amendments' section deleted."
  - amendment: "1"
    note: "WA Introduction (Volume One, Volume Two and Housing Provisions) replaced to list what the WA variations cover, with a note that the Building Regulations 2012, regulation 15C makes other modifications to the BCA."
  - amendment: "2"
    note: "Amendment 2 added to the history of adoption, and a List of amendments added to Volumes One and Three."

