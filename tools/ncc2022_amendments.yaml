          | 6 700 | 9 000 | 100 | 75 x 70 |
          | 8 200 | 11 000 | 100 | 100 x 75 |
          | 9 600 | 12 900 | 125 | 100 x 75 |
          | 12 800 | 17 100 | 125 | 100 x 100 |
          | 12 800 | 17 200 | 150 | 100 x 100 |
