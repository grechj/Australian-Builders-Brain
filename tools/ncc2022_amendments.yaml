new_pages:
  - amendment: "1"
    volume: volume_one
    state: WA
    part: F9
    title: Changes to AS/NZS 3500.3:2021
    filename: wa_part_f9_changes_to_as_nzs_3500_3_2021.md
    intro: This Part sets out changes for the application of AS/NZS 3500.3:2021 in Western Australia.
    clauses: &wa_gutter_clauses
      - code: "{p}D1"
        title: Eaves gutter overflow
        text: |
          Delete clause 3.5.1 of AS/NZS 3500.3:2021 and replace with the following:

          **3.5.1 General.** Eaves gutter systems, including downpipes, shall be designed and installed so that water will not flow back into the building. Overflow measures may be provided in accordance with Part 7.4 of the ABCB Housing Provisions Standard.

          > **Explanatory information**
          >
          > For the purposes of this clause the applicable clauses from Part 7.4 are 7.4.3(b); 7.4.4(1)(c), (2), (3) and (5); 7.4.6; and 7.4.7.
          >
          > AS/NZS 3500.3:2021 provides a Deemed-to-Satisfy Solution for the design and installation of eaves gutters however, it is without normative clauses for selecting their overflow measures. Part 7.4 of ABCB Housing Provisions which also provides a Deemed-to-Satisfy Solution for the design and installation of eaves gutters includes overflow measures.
          >
          > Both AS/NZS 3500.3:2021 and Part 7.4 of the ABCB Housing Provisions require that eaves gutters are designed for a 5-minute duration rainfall intensity determined for an annual exceedance probability of 5%; Part 7.4 of the ABCB Housing Provisions requiring that eaves gutter overflow provisions are determined for annual exceedance probability of 1%.
