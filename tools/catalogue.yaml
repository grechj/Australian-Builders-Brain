# What building materials are sold as: supplier-neutral facts that turn a
# takeoff quantity into things you can buy. No prices and no supplier item
# numbers live here: prices stay with each user (tools/price_list.py).
#
# Each family:
#   title       plain name
#   keywords    words that identify a takeoff line or product as this family
#   sold_as     length | sheet | bag | tin | box | pack | roll | each | m3 | lineal_m | m2
#   per         what a takeoff quantity of 1 means for this family, when it differs from one item
#   packs       the usual pack sizes, in takeoff units (litres per tin, screws per box)
#   lengths_m / sizes / sheet_sizes_m   the usual stock
#   coverage    rule of thumb the takeoff uses
#   guide       the brain page that explains the product
#   notes       what to check when matching a product
#
# "Usual" means commonly stocked in Australia; check the actual product.
# When a family changes, run `python tools/catalogue.py page` to refresh
# brain/references/product_catalogue.md.

families:
  framing_timber:
    title: Framing and structural timber (pine, hardwood, LVL)
    keywords: [joist, joists, bearer, bearers, stud, studs, plate, plates, nogging, noggings, rafter, rafters, beam, beams, mgp10, mgp12, lvl, framing]
    sold_as: length
    sizes: [70x35, 70x45, 90x35, 90x45, 140x45, 190x45, 240x45, 290x45]
    lengths_m: [2.4, 3.0, 3.6, 4.2, 4.8, 5.4, 6.0]
    guide: /guides/materials/timber_treatment_and_grades.md
    notes: Match section, grade (MGP10, MGP12, F17) and treatment (H2, H3) exactly. Some timber is priced per metre; the price list converts it to the length.
  posts:
    title: Posts
    keywords: [post, posts, stump, stumps]
    sold_as: length
    sizes: [90x90, 100x100, 125x125, 100x75]
    lengths_m: [2.4, 2.7, 3.0, 3.6]
    guide: /guides/materials/timber_treatment_and_grades.md
    notes: In-ground structural posts H5; fence posts H4; posts on stirrups H3 or hardwood.
  decking:
    title: Decking boards
    keywords: [decking, deck board, boards]
    sold_as: length
    sizes: [70x19, 86x19, 90x19, 140x19, 90x22, 140x22]
    lengths_m: [1.8, 2.4, 3.0, 3.6, 4.2, 4.8, 5.4, 6.0]
    guide: /guides/materials/decking.md
    notes: Hardwood is often priced per lineal metre in random lengths; pine and composite in set lengths.
  sleepers:
    title: Landscaping sleepers
    keywords: [sleeper, sleepers]
    sold_as: length
    sizes: [200x50, 200x75, 200x100]
    lengths_m: [1.8, 2.4, 3.0]
    guide: /guides/materials/timber_treatment_and_grades.md
  fence_palings:
    title: Fence palings and rails
    keywords: [paling, palings, rail, rails]
    sold_as: each
    sizes: [100x12, 150x12]
    lengths_m: [1.5, 1.65, 1.8, 2.1]
  plasterboard:
    title: Plasterboard
    keywords: [plasterboard, gyprock, ceiling board, wet area board]
    sold_as: sheet
    sizes: ["10mm", "13mm", "16mm"]
    sheet_sizes_m: ["1.2x2.4", "1.2x2.7", "1.2x3.0", "1.2x3.6", "1.2x4.2", "1.2x4.8", "1.2x6.0", "1.35x2.4", "1.35x3.6", "1.35x4.8", "1.35x6.0"]
    guide: /guides/materials/plasterboard_and_linings.md
    notes: Match thickness, type (standard, ceiling, wet area, fire, impact) and sheet size.
  fibre_cement_sheet:
    title: Fibre-cement sheet and cladding
    keywords: [fibre cement, fibre-cement, villaboard, hardiflex, cladding sheet, eaves lining]
    sold_as: sheet
    sizes: ["4.5mm", "6mm", "9mm"]
    sheet_sizes_m: ["0.45x2.4", "1.2x1.8", "1.2x2.4", "1.2x2.7", "1.2x3.0"]
    guide: /guides/materials/plasterboard_and_linings.md
  weatherboards:
    title: Weatherboards
    keywords: [weatherboard, weatherboards]
    sold_as: length
    lengths_m: [4.2, 4.8, 5.4]
    guide: /guides/materials/sarking_and_wraps.md
    notes: Cover per board depends on the profile and lap; check the maker's guide.
  premix_concrete:
    title: Concrete premix bags
    keywords: [premix, concrete mix, rapid set]
    sold_as: bag
    packs_kg: [20]
    coverage: 0.0095 m³ per 20 kg bag (takeoff default; check the bag)
    guide: /guides/materials/concrete.md
    notes: The takeoff counts 20 kg bags; a 30 kg bag isn't a match.
  ready_mix:
    title: Ready-mix concrete
    keywords: [ready-mix, readymix, concrete m3]
    sold_as: m3
    guide: /guides/materials/concrete.md
    notes: Not a hardware store product. Ordered by grade and slump from a concrete plant; minimum loads apply.
  reinforcing_mesh:
    title: Reinforcing mesh and trench mesh
    keywords: [mesh, sl72, sl82, sl92, trench mesh]
    sold_as: sheet
    sheet_sizes_m: ["6.0x2.4"]
    coverage: 12.76 m² per 6.0 x 2.4 sheet after 200 mm laps (takeoff default)
    guide: /guides/materials/concrete.md
  bar_chairs:
    title: Bar chairs
    keywords: [bar chair, bar chairs]
    sold_as: pack
    packs: [50, 100]
  builders_film:
    title: Vapour barrier and builder's film
    keywords: [vapour barrier, builders film, polyethylene, underlay]
    sold_as: roll
    per: m2
    guide: /guides/code/footings_and_slabs.md
    notes: Read the roll's m² off the label (width x length) and use it as the pack size. Under house slabs it must be 0.2 mm, branded AS 2870.
  decking_screws:
    title: Decking and batten screws
    keywords: [decking screws, batten screws, screws]
    sold_as: box
    packs: [100, 200, 250, 500, 1000, 2000]
    guide: /guides/materials/fixings_and_corrosion.md
    notes: Stainless (304 or 316) or Class 4 to suit the treatment and distance from the coast.
  plasterboard_screws:
    title: Plasterboard screws
    keywords: [plasterboard screws, drywall screws]
    sold_as: box
    packs: [500, 1000, 2000]
  nails:
    title: Nails
    keywords: [nails, nail]
    sold_as: box
    packs: [100, 250, 500, 1000, 2000]
    notes: Some nails are sold by weight (1 kg, 5 kg); count per kg is on the box.
  roofing_screws:
    title: Roofing screws
    keywords: [roofing screws, roof screws]
    sold_as: box
    packs: [50, 100, 250, 500, 1000]
    guide: /guides/materials/fixings_and_corrosion.md
    notes: Class 3 or 4 to the sheet maker's spec and the environment.
  connectors:
    title: Framing connectors (triple grips, joist hangers, stirrups, brackets)
    keywords: [triple grip, framing anchor, joist hanger, stirrup, bracket, brackets]
    sold_as: each
    packs: [1, 10, 20, 50]
    guide: /guides/materials/fixings_and_corrosion.md
    notes: Often sold singly and in packs; match the finish (galvanised, stainless).
  bolts:
    title: Bolts and anchors
    keywords: [bolt, bolts, cup head, coach screw, anchor, dynabolt]
    sold_as: each
    packs: [1, 2, 4, 10, 25, 50]
    guide: /guides/materials/fixings_and_corrosion.md
  paint:
    title: Paint, primer and sealer
    keywords: [paint, primer, sealer, undercoat, stain, oil]
    sold_as: tin
    packs: [1, 2, 4, 10, 15]
    coverage: 16 m² per litre per coat (takeoff default for acrylic walls; check the tin)
    guide: /guides/materials/paint_systems.md
    notes: Buy the mix of tin sizes that costs least; the price list does this when it has prices for several sizes.
  membrane:
    title: Waterproofing membrane
    keywords: [membrane, waterproofing]
    sold_as: tin
    packs: [1, 4, 15]
    guide: /guides/materials/membranes_and_sealants.md
    notes: Must be a wet area membrane to AS/NZS 4858 for bathrooms.
  tile_adhesive:
    title: Tile adhesive
    keywords: [tile adhesive]
    sold_as: bag
    packs_kg: [20]
  grout:
    title: Grout
    keywords: [grout]
    sold_as: bag
    packs_kg: [2, 5]
  jointing_compound:
    title: Plaster jointing compound
    keywords: [jointing compound, base coat, topping]
    sold_as: bag
    packs_kg: [4.5, 20]
  paper_tape:
    title: Paper jointing tape
    keywords: [joint tape, jointing tape]
    sold_as: roll
    packs: [75, 150]
  cornice:
    title: Cornice
    keywords: [cornice]
    sold_as: length
    lengths_m: [3.6, 4.2, 4.8, 6.0]
  sealant:
    title: Sealants and adhesives (cartridges)
    keywords: [sealant, silicone, adhesive, cartridges, cartridge]
    sold_as: each
    guide: /guides/materials/membranes_and_sealants.md
  insulation_batts:
    title: Insulation batts
    keywords: [batts, insulation]
    sold_as: pack
    per: m2
    guide: /guides/materials/insulation.md
    notes: Read the m² per pack off the label for the R-value and width; pass it to the takeoff as pack_m2.
  sarking_and_wrap:
    title: Sarking, roof blanket and wall wrap
    keywords: [sarking, wall wrap, roof blanket, building wrap]
    sold_as: roll
    per: m2
    guide: /guides/materials/sarking_and_wraps.md
    notes: Read the roll's m² off the label and use it as the pack size.
  roof_sheeting:
    title: Roof sheeting
    keywords: [roof sheet, roof sheeting, corrugated, colorbond]
    sold_as: lineal_m
    notes: Cut to length; priced per lineal metre of sheet. Cover width depends on the profile (about 0.762 m corrugated).
  gutter_downpipe:
    title: Gutter and downpipe
    keywords: [gutter, downpipe, downpipes]
    sold_as: length
    lengths_m: [3.0, 6.0]
  ag_pipe:
    title: Slotted drainage pipe
    keywords: [ag pipe, slotted, drainage pipe]
    sold_as: roll
    per: lineal_m
    packs: [20, 50]
  gravel:
    title: Gravel, sand and soil
    keywords: [gravel, sand, aggregate, soil]
    sold_as: m3
    notes: Bulk by the cubic metre from a landscape supplier, or in 20 to 25 kg bags for small jobs (gravel weighs about 1.5 to 1.7 tonnes per m³, so 60 to 85 bags of 20 to 25 kg; check the bag).
  geofabric:
    title: Geotextile fabric
    keywords: [geofabric, geotextile]
    sold_as: roll
    per: m2
