# "Things you can say": one card per skill, shown by the start skill and the
# home page, filtered to the skills in the user's trade profile. Plain words,
# the way a builder or tradie would ask. `skills` holds the neutral examples;
# `by_trade` replaces them for the common trades; `ncc_by_trade` holds the
# building code questions. No sample job names (use "the Smith job").

skills:
  projects:
    title: Jobs and paperwork
    does: Keeps a folder per job and reads the invoices, receipts and photos you drop in.
    say:
    - Start a new job for the Smiths at 14 Ocean St
    - Process my inbox
    - Here's a supplier invoice for the Smith job
  estimating:
    title: Quotes
    does: Builds estimates and quotes, compares subbie quotes and checks your margin.
    say:
    - Quote this job from my notes
    - Compare these two supplier quotes
    - What margin am I making at this price?
  materials:
    title: Materials lists
    does: Works out what to buy and roughly what it costs.
    say:
    - What materials do I need for this job?
    - Rough materials cost for the Smith job
    - Add today's supplier prices to my price list
  contracts:
    title: Contracts and setup
    does: 'Sets a job up after it''s signed: summary, scope, subcontracts, pre-start checklist.'
    say:
    - 'I''ve just signed the Smith job: set it up'
    - Write a subcontract for my electrician
    - What do I need before I start on site?
  variations:
    title: Variations
    does: Prices changes, gets them signed and keeps the register.
    say:
    - 'The client wants extra work: price a variation'
    - 'Price a variation: 6 hours labour and $480 materials'
    - Show me my variations on the Smith job
  claims:
    title: Claims and getting paid
    does: Progress claims, tax invoices, payment claims under the Act, and chasing payment.
    say:
    - Invoice the client for the work done this week
    - Do the next progress claim on the Smith job
    - A client hasn't paid my invoice
  notices:
    title: Notices
    does: Delay letters, site instructions, back charges, and suspension or breach notices.
    say:
    - Rain held us up three days last week
    - Write a site instruction for the change
    - 'The client still hasn''t paid: what are my options?'
  site:
    title: Site records
    does: Site diary, client updates, RFIs, minutes, the program and day work dockets.
    say:
    - 'Log today: two of us on site, rained after lunch'
    - Send the client this week's update
    - Ask the designer about a detail on the drawings
  safety:
    title: Safety (WHS)
    does: SWMS, safety plans, toolbox talks, inductions and incident reports.
    say:
    - SWMS for working at heights
    - Toolbox talk on manual handling
    - Someone cut their hand on site this morning
  handover:
    title: Handover
    does: Practical completion, defects, warranties and the final account.
    say:
    - Book the final inspection
    - List the defects from today's walk-through
    - Do the final account
  financials:
    title: Job costs
    does: Budget against actual, job profit and loss, and lessons learned.
    say:
    - How's the Smith job tracking against budget?
    - What did we make on our last job?
  accounts:
    title: Accounts and dashboard
    does: Gets your jobs into Xero, MYOB or QuickBooks, BAS and TPAR figures, and the dashboard.
    say:
    - Show me how my jobs are going
    - Export this month's bills for Xero
    - What's my GST for the September quarter?
  ncc:
    title: Building code (NCC)
    does: Answers code questions with the clause, for your state.
    say:
    - Minimum balustrade height on a deck?
