name: release

# On every version tag (v0.13.0 ...), publish a GitHub release with the plugin
# as a zip, for Customize > Plugins > Upload plugin in Claude.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin zip
        run: git archive --format=zip -o australian-builders-brain.zip HEAD
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every changelog section since the last published release, so skipped versions aren't lost.
          prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          prev=${prev#v}
          {
            echo "Install: download australian-builders-brain.zip, then in Claude go to Customize > Plugins > Add > Upload plugin."
            echo
            if [ -n "$prev" ] && grep -q "^## $prev " CHANGELOG.md; then
              awk -v stop="## $prev " 'index($0, stop) == 1 {exit} /^## /{n++} n>=1' CHANGELOG.md
            else
              awk '/^## /{n++} n==1' CHANGELOG.md
            fi
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" australian-builders-brain.zip --title "Australian Builder's Brain $GITHUB_REF_NAME" --notes-file notes.md
