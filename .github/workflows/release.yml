name: release

# On every version tag (v0.13.0 ...), publish a GitHub release with the plugin
# as a zip, for Customize > Plugins > Upload plugin in Claude.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin zip
        run: git archive --format=zip -o australian-builders-brain.zip HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" australian-builders-brain.zip \
            --title "Australian Builder's Brain $GITHUB_REF_NAME" \
            --notes "Install: download australian-builders-brain.zip, then in Claude go to Customize > Plugins > Add > Upload plugin.

$notes"
