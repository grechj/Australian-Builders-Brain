name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Lint the brain (OKF conformance, links, placeholders, workbooks, computation hashes)
        run: python tools/okf_lint.py
      - name: Fill every example template
        run: python tools/test_examples.py
      - name: Price list matching
        run: python tools/test_price_list.py
      - name: Product catalogue (families, pack sizes, pack mixes, page current)
        run: python tools/test_catalogue.py
      - name: Learning from use (report, opt-in sharing, nothing private in the summary)
        run: python tools/test_usage.py
      - name: Trade and location profiles
        run: python tools/test_profile.py
      - name: Materials takeoff (hand-checked)
        run: python tools/test_takeoff.py
      - name: Finance exports, BAS and TPAR (hand-checked)
        run: python tools/test_finance.py
      - name: Projects, tags and the inbox
        run: python tools/test_projects.py
      - name: First-run setup and home page
        run: python tools/test_start.py
      - name: Plain-English guides (found, and every figure pinned to the NCC)
        run: python tools/test_guides.py
